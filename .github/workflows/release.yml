name: Signed release

on:
  push:
    tags:
      - "**"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, sign, and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x

          missing=0
          for name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEY_ALIAS \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Repository secret ${name} is not configured"
              missing=1
            fi
          done
          [[ "$missing" -eq 0 ]]

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Android SDK 37
        shell: bash
        run: >-
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          --channel=3
          "platforms;android-37.0"
          "build-tools;37.0.0"

      - name: Test and build ABI variants
        shell: bash
        run: ./gradlew clean testDebugUnitTest assembleRelease -PsplitAbi=true

      - name: Sign and validate APKs
        id: package
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          umask 077

          metadata="app/build/outputs/apk/release/output-metadata.json"
          release_dir="$(dirname "$metadata")"
          dist_dir="$GITHUB_WORKSPACE/dist"
          keystore_path="$RUNNER_TEMP/HyperAICRBypass-release.p12"
          build_tools="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          aapt2="$build_tools/aapt2"

          cleanup() {
            rm -f "$keystore_path"
          }
          trap cleanup EXIT

          [[ -f "$metadata" ]] || {
            echo "::error::Missing AGP output metadata: $metadata"
            exit 1
          }
          [[ -x "$apksigner" && -x "$aapt2" ]] || {
            echo "::error::Android signing tools are unavailable"
            exit 1
          }

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          mkdir -p "$dist_dir"

          element_count="$(jq '.elements | length' "$metadata")"
          [[ "$element_count" -eq 5 ]] || {
            echo "::error::Expected 5 APK outputs, found $element_count"
            exit 1
          }

          declare -A unsigned_apks=()
          while IFS= read -r element; do
            output_file="$(jq -r '.outputFile' <<<"$element")"
            filter_count="$(jq '.filters | length' <<<"$element")"

            if [[ "$filter_count" -eq 0 ]]; then
              classifier="universal"
            elif [[ "$filter_count" -eq 1 ]] \
              && [[ "$(jq -r '.filters[0].filterType' <<<"$element")" == "ABI" ]]; then
              classifier="$(jq -r '.filters[0].value' <<<"$element")"
            else
              echo "::error::Unexpected APK filter set for $output_file"
              exit 1
            fi

            case "$classifier" in
              universal|arm64-v8a|armeabi-v7a|x86|x86_64) ;;
              *)
                echo "::error::Unexpected APK classifier: $classifier"
                exit 1
                ;;
            esac

            [[ -z "${unsigned_apks[$classifier]:-}" ]] || {
              echo "::error::Duplicate APK classifier: $classifier"
              exit 1
            }
            unsigned_apks[$classifier]="$release_dir/$output_file"
          done < <(jq -c '.elements[]' "$metadata")

          expected_classifiers=(universal arm64-v8a armeabi-v7a x86 x86_64)
          for classifier in "${expected_classifiers[@]}"; do
            input="${unsigned_apks[$classifier]:-}"
            [[ -n "$input" && -f "$input" ]] || {
              echo "::error::Missing unsigned APK for $classifier"
              exit 1
            }

            output="$dist_dir/$classifier.apk"
            "$apksigner" sign \
              --ks "$keystore_path" \
              --ks-type PKCS12 \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "$output" \
              "$input"
            "$apksigner" verify --verbose --print-certs "$output"

            actual_abis="$(
              unzip -Z1 "$output" \
                | sed -n 's#^lib/\([^/]*\)/libdexkit\.so$#\1#p' \
                | sort -u \
                | paste -sd, -
            )"
            if [[ "$classifier" == "universal" ]]; then
              expected_abis="arm64-v8a,armeabi-v7a,x86,x86_64"
            else
              expected_abis="$classifier"
            fi
            [[ "$actual_abis" == "$expected_abis" ]] || {
              echo "::error::$classifier contains DexKit ABIs '$actual_abis', expected '$expected_abis'"
              exit 1
            }

            expected_module_prop=$'minApiVersion=102\ntargetApiVersion=102\nstaticScope=true'
            expected_scope=$'com.miui.gallery\ncom.xiaomi.aicr\ncom.xiaomi.aiservice'
            expected_entry='com.wayne.hyperaicrbypass.MainHook'
            actual_module_prop="$(unzip -p "$output" META-INF/xposed/module.prop | tr -d '\r')"
            actual_scope="$(unzip -p "$output" META-INF/xposed/scope.list | tr -d '\r')"
            actual_entry="$(unzip -p "$output" META-INF/xposed/java_init.list | tr -d '\r')"
            [[ "$actual_module_prop" == "$expected_module_prop" ]] || {
              echo "::error::$classifier has invalid modern Xposed module metadata"
              exit 1
            }
            [[ "$actual_scope" == "$expected_scope" ]] || {
              echo "::error::$classifier has an unexpected static Xposed scope"
              exit 1
            }
            [[ "$actual_entry" == "$expected_entry" ]] || {
              echo "::error::$classifier has an unexpected modern Xposed entry point"
              exit 1
            }
            if unzip -Z1 "$output" | grep -Fxq 'assets/xposed_init'; then
              echo "::error::$classifier still contains the legacy Xposed entry point"
              exit 1
            fi
          done

          package_line="$($aapt2 dump badging "$dist_dir/universal.apk" | sed -n '1p')"
          version_code="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$package_line")"
          version_name="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$package_line")"
          safe_version_name="${version_name// /_}"
          expected_tag="${version_code}-${safe_version_name}"

          [[ -n "$version_code" && -n "$version_name" ]] || {
            echo "::error::Unable to read APK version metadata"
            exit 1
          }
          [[ "$GITHUB_REF_NAME" == "$expected_tag" ]] || {
            echo "::error::Tag '$GITHUB_REF_NAME' must equal APK version '$expected_tag'"
            exit 1
          }

          for classifier in "${expected_classifiers[@]}"; do
            final_path="$dist_dir/HyperAICRBypass-${version_name}-${classifier}.apk"
            mv "$dist_dir/$classifier.apk" "$final_path"
            case "$classifier" in
              universal) output_key="universal_path" ;;
              arm64-v8a) output_key="arm64_path" ;;
              armeabi-v7a) output_key="arm32_path" ;;
              x86) output_key="x86_path" ;;
              x86_64) output_key="x64_path" ;;
            esac
            echo "$output_key=$final_path" >> "$GITHUB_OUTPUT"
          done
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Create immutable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.package.outputs.version_name }}
          UNIVERSAL_PATH: ${{ steps.package.outputs.universal_path }}
          ARM64_PATH: ${{ steps.package.outputs.arm64_path }}
          ARM32_PATH: ${{ steps.package.outputs.arm32_path }}
          X86_PATH: ${{ steps.package.outputs.x86_path }}
          X64_PATH: ${{ steps.package.outputs.x64_path }}
        run: |
          set -euo pipefail
          set +x

          if release_json="$(gh release view "$GITHUB_REF_NAME" --json isDraft 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
              echo "::error::Release $GITHUB_REF_NAME is already public and immutable"
              exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" --yes
          fi

          assets=(
            "$UNIVERSAL_PATH"
            "$ARM64_PATH"
            "$ARM32_PATH"
            "$X86_PATH"
            "$X64_PATH"
          )
          release_notes="$GITHUB_WORKSPACE/.github/release-notes/${VERSION_NAME}.md"
          notes_args=(--generate-notes)
          if [[ -f "$release_notes" ]]; then
            notes_args=(--notes-file "$release_notes")
          fi

          gh release create "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            --verify-tag \
            --draft \
            --title "$VERSION_NAME" \
            "${notes_args[@]}"

          release_json="$(gh release view "$GITHUB_REF_NAME" --json isDraft,assets)"
          [[ "$(jq -r '.isDraft' <<<"$release_json")" == "true" ]] || {
            echo "::error::Release left draft state before validation"
            exit 1
          }

          expected_assets="$(printf '%s\n' \
            "HyperAICRBypass-${VERSION_NAME}-universal.apk" \
            "HyperAICRBypass-${VERSION_NAME}-arm64-v8a.apk" \
            "HyperAICRBypass-${VERSION_NAME}-armeabi-v7a.apk" \
            "HyperAICRBypass-${VERSION_NAME}-x86.apk" \
            "HyperAICRBypass-${VERSION_NAME}-x86_64.apk" \
            | sort)"
          actual_assets="$(jq -r '.assets[].name' <<<"$release_json" | sort)"
          [[ "$actual_assets" == "$expected_assets" ]] || {
            echo "::error::Draft asset set does not match the five expected APKs"
            exit 1
          }

          gh release edit "$GITHUB_REF_NAME" --draft=false
